<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de Investimentos</title>
  <meta name="description" content="Ações da B3 e ETFs: indicadores, histórico e oportunidades, atualizado todo dia.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone.svg">
  <meta name="theme-color" content="#0f172a">
  <!-- Tema escolhido no botão: aplicado antes de desenhar, para a tela não piscar -->
  <script>try { const t = localStorage.getItem('comparador.tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Menu lateral no computador; no celular vira a barra de abas do topo -->
  <aside class="lateral">
    <a class="marca" href="#inicio">
      <span class="marca-logo" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#0f172a"/><rect x="11" y="26" width="7" height="12" rx="2" fill="#5598e7"/><rect x="20.5" y="19" width="7" height="19" rx="2" fill="#5598e7" fill-opacity=".7"/><rect x="30" y="12" width="7" height="26" rx="2" fill="#1baf7a"/><path d="M10 21 L22 13 L28 16 L38 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="marca-nome">Comparador<small>de Investimentos</small></span>
    </a>
    <nav class="abas" id="abas" aria-label="Seções">
      <a href="#inicio" data-aba="inicio"><svg viewBox="0 0 20 20"><path d="M3 9.5 10 3l7 6.5V17H12v-5H8v5H3z"/></svg>Início</a>
      <a href="#oportunidades" data-aba="oportunidades"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3"/></svg>Oportunidades</a>
      <a href="#carteiras" data-aba="carteiras"><svg viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="2"/><path d="M7 6V4.5A1.5 1.5 0 0 1 8.5 3h3A1.5 1.5 0 0 1 13 4.5V6"/></svg>Carteira</a>
      <a href="#ranking" data-aba="ranking"><svg viewBox="0 0 20 20"><path d="M4 16V9M10 16V4M16 16v-5"/></svg>Ranking e filtros</a>
      <a href="#comparar" data-aba="comparar"><svg viewBox="0 0 20 20"><path d="M4 7h12M4 7l3-3M4 7l3 3M16 13H4M16 13l-3-3M16 13l-3 3"/></svg>Comparar</a>
      <a href="#etfs" data-aba="etfs"><svg viewBox="0 0 20 20"><path d="M3 15l4-5 3 3 7-8"/><path d="M3 18h14"/></svg>ETFs e renda fixa</a>
      <a href="#metodo" data-aba="metodo"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 2.5 1.9c-.4.1-.5.4-.5.8V12M10 14.5v.01"/></svg>Como funciona</a>
    </nav>
    <div class="lateral-rodape">
      <p class="atualizado" id="atualizado"></p>
      <button class="botao-tema" id="tema" type="button"></button>
    </div>
  </aside>

  <div class="conteudo">
    <header class="topo">
      <div class="busca-caixa">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3.5 3.5"/></svg>
        <input id="busca" type="search" placeholder="Buscar ação ou ETF (ex.: ITUB4, Porto)" autocomplete="off" aria-label="Buscar ativo" aria-controls="busca-lista">
        <kbd>/</kbd>
        <ul class="busca-lista" id="busca-lista" role="listbox" hidden></ul>
      </div>
      <div class="modo-precos" id="modo-precos" hidden></div>
      <div class="contexto" id="contexto"></div>
    </header>

    <main>
      <section id="aba-inicio" class="aba"></section>
      <section id="aba-ativo" class="aba"></section>
      <section id="aba-oportunidades" class="aba"></section>
      <section id="aba-carteiras" class="aba"></section>
      <section id="aba-ranking" class="aba"></section>
      <section id="aba-comparar" class="aba"></section>
      <section id="aba-etfs" class="aba"></section>
      <section id="aba-metodo" class="aba"></section>
    </main>

    <footer class="rodape">
      Dados públicos da CVM, B3, Banco Central e Tesouro Nacional. A ferramenta aponta candidatas para
      estudo, não recomenda compra nem venda.
    </footer>
  </div>
  <div class="dica" id="dica" role="tooltip" hidden></div>

  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
