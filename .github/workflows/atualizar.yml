# Atualiza os dados todo dia útil e publica a página no GitHub Pages.
# O banco SQLite fica guardado como anexo da release "banco" (fora do histórico do git).
name: Atualizar dados

on:
  # O GitHub atrasa os agendamentos em até ~6 h no plano gratuito; por isso há horários de reserva.
  # Execução sem nada novo leva ~1 min e não muda nada.
  schedule:
    - cron: '30 13-20 * * 1-5'  # de hora em hora, das 10h30 às 17h30 de Brasília: preços do pregão (parciais, 15 min de atraso)
    - cron: '45 23 * * 1-5'  # 20h45 de Brasília, logo depois do arquivo de cotações da B3 (~20h30)
    - cron: '30 1 * * 2-6'   # 22h30 de Brasília, reserva caso a anterior atrase
    - cron: '0 11 * * 1-5'   # 8h de Brasília: balanços entregues de madrugada e arquivo atrasado
    - cron: '0 15 * * 0'     # domingo 12h de Brasília: a CVM regenera os arquivos de balanço aos domingos
  workflow_dispatch:
    inputs:
      modo:
        description: 'diaria = fechamento oficial e balanços; intraday = só preços do pregão; carga-inicial = refaz tudo desde 2016 (~10 min)'
        type: choice
        options: [diaria, intraday, carga-inicial]
        default: diaria

permissions:
  contents: write   # anexar o banco à release
  pages: write
  id-token: write
  actions: write    # manter os agendamentos ativos (ver o último passo)

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url || steps.publicar2.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Os horários de pregão (de hora em hora) só buscam preços; os demais fazem a atualização completa
      - name: Escolher o modo
        id: modo
        run: |
          case "${{ github.event.schedule }}" in
            '30 13-20 * * 1-5') m=intraday ;;
            '') m="${{ inputs.modo || 'diaria' }}" ;;
            *) m=diaria ;;
          esac
          echo "modo=$m" >> "$GITHUB_OUTPUT"
          echo "Modo: $m"

      - name: Testar acesso às fontes
        run: |
          for url in \
            "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A$(date +%Y).ZIP" \
            https://dados.cvm.gov.br/dados/CIA_ABERTA/CAD/DADOS/cad_cia_aberta.csv \
            "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json"; do
            echo "$(curl -s -o /dev/null -I -m 30 -w '%{http_code}' "$url") $url"
          done

      # Release inexistente (primeira vez) leva à carga inicial; qualquer outra falha para a execução,
      # para um banco vazio nunca ser guardado por cima do bom
      - name: Baixar o banco atual
        if: steps.modo.outputs.modo != 'carga-inicial'
        run: |
          mkdir -p dados
          if saida=$(gh api "repos/${{ github.repository }}/releases/tags/banco" 2>&1); then
            gh release download banco --pattern comparador.db.gz --dir dados
            cp dados/comparador.db.gz dados/comparador-anterior.db.gz
            gunzip -f dados/comparador.db.gz
            gunzip -kf dados/comparador-anterior.db.gz
          elif echo "$saida" | grep -q "HTTP 404"; then
            echo "Release do banco não existe; será feita a carga inicial"
          else
            echo "::error::Não foi possível consultar a release do banco: $saida"
            exit 1
          fi

      - name: Atualizar
        id: atualizar
        run: |
          case "${{ steps.modo.outputs.modo }}" in
            intraday) npm run intraday ;;
            carga-inicial) npm run carga-inicial ;;
            *) if [ -f dados/comparador.db ]; then npm run atualizar; else npm run carga-inicial; fi ;;
          esac || echo "falhou=1" >> "$GITHUB_OUTPUT"

      # Banco vazio ou menor que o anterior é reprovado: a execução para aqui e o site fica como estava
      - name: Conferir o banco
        run: node --disable-warning=ExperimentalWarning src/conferir.js dados/comparador.db dados/comparador-anterior.db

      # Guarda o novo e, ao lado, a versão anterior (cópia de segurança de um dia)
      - name: Guardar o banco
        run: |
          gzip -kf dados/comparador.db
          gh release view banco >/dev/null 2>&1 \
            || gh release create banco --title "Banco de dados" --notes "Banco SQLite atualizado automaticamente. Não apagar."
          gh release upload banco dados/comparador.db.gz --clobber
          if [ -f dados/comparador-anterior.db.gz ] && [ "${{ steps.modo.outputs.modo }}" = "diaria" ]; then
            gh release upload banco dados/comparador-anterior.db.gz --clobber
          fi

      # Número da execução nos links dos arquivos: o navegador baixa a versão nova em vez da guardada
      - name: Versionar arquivos da página
        run: sed -i -E 's/(estilo\.css|app\.js|dados\.js)"/\1?v=${{ github.run_id }}"/g' site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # A publicação às vezes falha por instabilidade do GitHub ("Fetching artifact metadata failed");
      # espera e tenta de novo antes de dar a execução como falha
      - id: publicar
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes de tentar publicar de novo
        if: steps.publicar.outcome == 'failure'
        run: sleep 60

      - id: publicar2
        if: steps.publicar.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Em repositório público o GitHub desliga os agendamentos depois de 60 dias sem commit; reativar
      # o workflow pela API aos domingos zera essa contagem sem precisar de commit
      - name: Manter os agendamentos ativos
        if: github.event.schedule == '0 15 * * 0'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atualizar.yml/enable"

      # Alguma fonte falhou: os dados que deram certo já foram salvos e publicados,
      # mas a execução fica vermelha para o GitHub avisar por e-mail
      - name: Avisar falha parcial
        if: steps.atualizar.outputs.falhou == '1'
        run: |
          echo "::error::Uma ou mais fontes falharam. Veja o passo Atualizar."
          exit 1
